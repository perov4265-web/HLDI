; PlatformIO project for the HLDI controller firmware.
;
; Two targets:
;   [env:bluepill_f103c8]  — STM32F103 "Blue Pill": the faithful port, same
;                            MCU as the original (folder HLDI_Firmware/).
;   [env:uno] / [env:mega] — simplified AVR build for bench testing and simple
;                            jobs (folder HLDI_Firmware_AVR/).
;
; Pick the env when building:
;   pio run -e bluepill_f103c8
;   pio run -e uno
;   pio run -e mega -t upload

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8
framework = arduino
board_build.f_cpu = 72000000L
build_flags =
    -D HLDI_BAUD=115200
    -D ENABLE_HWSERIAL1
build_src_filter = +<HLDI_Firmware/>
upload_protocol = stlink
monitor_speed = 115200

; ---------------------------------------------------------------------------
; Simplified AVR builds.  See HLDI_Firmware_AVR/hldi_config_avr.h for the
; important note on what this subset can and cannot do.
; ---------------------------------------------------------------------------
[env:uno]
platform = atmelavr
board = uno
framework = arduino
build_src_filter = +<HLDI_Firmware_AVR/>
monitor_speed = 115200

[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
build_src_filter = +<HLDI_Firmware_AVR/>
monitor_speed = 115200

; ---------------------------------------------------------------------------
; ESP32 build: WiFi + Bluetooth (BLE) wireless link with auto-discovery.
; See HLDI_Firmware_ESP32/ and docs/PROTOCOL.md (discovery section).
; ---------------------------------------------------------------------------
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
build_src_filter = +<HLDI_Firmware_ESP32/>
monitor_speed = 115200
; BLE + WiFi are part of the Arduino-ESP32 core; no extra libs needed.
